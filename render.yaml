# Java V2 production service on Render. Secrets marked sync:false must be set in
# the Render dashboard and must never be committed to this repository.
services:
  - type: web
    name: van-tai-xuan-truong
    runtime: docker
    plan: free
    dockerfilePath: ./backend-v2/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFY_TO
        sync: false
