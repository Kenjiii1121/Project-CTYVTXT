spring.application.name=transport-backend-v2
spring.config.import=optional:file:.env[.properties],optional:file:../backend/.env[.properties]

server.address=${HOST:0.0.0.0}
server.port=${PORT:3001}
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.name=TRANSPORT_SESSION

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.cleanup-cron=0 */10 * * * *

spring.jackson.default-property-inclusion=non_null
spring.threads.virtual.enabled=true
logging.level.root=INFO
logging.level.vn.xuantruong.transport=INFO
